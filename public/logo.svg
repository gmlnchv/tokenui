<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Soft shadow for grounding -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#020617" flood-opacity="0.15"/>
    </filter>
    
    <!-- Polished ceramic gradient (charcoal/obsidian tone) -->
    <radialGradient id="ceramic" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#475569" />     <!-- Soft slate highlight -->
      <stop offset="45%" stop-color="#1e293b" />    <!-- Mid charcoal -->
      <stop offset="100%" stop-color="#020617" />   <!-- Deep edge -->
    </radialGradient>
    
    <!-- Bright ambient reflection/highlight to give it gloss -->
    <radialGradient id="highlight" cx="35%" cy="25%" r="40%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Perfectly round polished pebble -->
  <circle cx="16" cy="16" r="14" fill="url(#ceramic)" filter="url(#shadow)"/>
  <circle cx="16" cy="16" r="14" fill="url(#highlight)"/>
</svg>